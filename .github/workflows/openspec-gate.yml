# The agent-agnostic enforcement floor in CI (spec §18): every active OpenSpec change
# must pass `openspec validate --all` AND carry REVIEWS.md with >=2 reviewers before its
# code lands. The per-agent PreToolUse hook is faster feedback; this is the guarantee —
# it catches edits from any agent or a human, including the session that installed the hook.
name: OpenSpec change gate
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install OpenSpec
        run: npm i -g @fission-ai/openspec
      - name: Resolve core artifacts from the pin
        # Since ADR-0047 this repo does not vendor the gate or the wrapper — it
        # pins them. Materialise the pinned bytes once, here, and let every step
        # below score and run exactly what install.sh would publish.
        #
        # The `test -s` is not belt-and-braces. When these were vendored and the
        # files went missing, change-gate-conformance.sh printed
        # "SKIP (not found)" and "TOTAL: 0 passed, 0 failed" — and exited 0. A
        # harness that reports success for a file that is not there certifies
        # nothing while looking green, so prove the bytes exist before scoring.
        run: |
          set -euo pipefail
          mkdir -p .core-bin
          for f in openspec-change-gate reviewer-cli; do
            src="$(bash bin/resolve-core-artifact.sh tools/core-vendor.manifest "bin/$f.sh")"
            install -m 0755 "$src" ".core-bin/$f.sh"
            rm -f "$src"
            test -s ".core-bin/$f.sh"
          done
      - name: Prove the gate itself is conformant
        # A gate that has drifted can pass every repo it guards while enforcing
        # nothing (core#32: five copies, none conformant). Score it before
        # trusting its verdict. The harness is still vendored and is checked
        # against the same pin by the migration suite, so a stale harness cannot
        # quietly certify a stale gate.
        run: bash tools/change-gate-conformance.sh .core-bin/openspec-change-gate.sh
      - name: Prove the review producer's wrapper is conformant
        # The gate consumes review evidence; reviewer-cli.sh produces it. A
        # wrapper that silently lost a vendor arm degrades that evidence and
        # reports nothing while doing it (core#41). Same bar, same reason.
        run: bash tools/reviewer-cli-conformance.sh .core-bin/reviewer-cli.sh
      - name: Run the change gate
        # exit 0 = all active changes validate; exit 1 = block the PR. Since gate
        # 2.0.0 review evidence is REPORTED, never enforced — a missing or stale
        # review is a NOTE, and only `openspec validate --all` can block.
        run: bash .core-bin/openspec-change-gate.sh --ci
